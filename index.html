// 1. OFFLINE-FIRST STORAGE ENGINE (IndexedDB Primary + LocalStorage Fallback)
// ============================================================================
const DB_NAME = 'CognitiveEcologySanctuary_DB';
const DB_VERSION = 2;
const STORE_NAME = 'sanctuary_state';
const LS_KEY = 'cognitive_ecology_sanctuary_v2';

const openSanctuaryDB = () => {
  return new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !window.indexedDB) {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    try {
      const request = window.indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = (e) => resolve(e.target.result);
      request.onerror = (e) => reject(e.target.error);
    } catch (err) {
      reject(err);
    }
  });
};

const saveStateOffline = async (state) => {
  try {
    window.localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) {
    // Ignore sandbox storage errors
  }
  try {
    const db = await openSanctuaryDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(state, 'root');
      tx.oncomplete = () => resolve({ engine: '离线溫室已同步', ok: true });
      tx.onerror = () => resolve({ engine: '本地記憶已同步', ok: true });
    });
  } catch (e) {
    return { engine: '本地記憶已同步', ok: true };
  }
};

const loadStateOffline = async () => {
  try {
    const db = await openSanctuaryDB();
    const idbData = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get('root');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (idbData) return { data: idbData, engine: '离线溫室已同步' };
  } catch (e) {
    // Fallback to localStorage
  }
  try {
    const raw = window.localStorage.getItem(LS_KEY);
    if (raw) {
      return { data: JSON.parse(raw), engine: '本地記憶已同步' };
    }
  } catch (e) {
    // Ignore
  }
  return { data: null, engine: '靜謐連線中' };
};

// ============================================================================
// 3. HARMONIC SINGING BOWL & WIND CHIME AUDIO ENGINE (溫潤頌缽與風鈴音場)
// ============================================================================
const createSanctuaryAudio = () => {
  let ctx = null;
  const getCtx = () => {
    if (typeof window === 'undefined') return null;
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  };

  return {
    play(type, enabled = true) {
      if (!enabled) return;
      const audio = getCtx();
      if (!audio) return;
      const now = audio.currentTime;

      try {
        if (type === 'breeze') {
          // Ethereal wind chime + soft air release when letting go of external tasks
          const notes = [528, 660, 792, 1056];
          notes.forEach((freq, i) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            const start = now + i * 0.08;
            osc.frequency.setValueAtTime(freq, start);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.02, start + 0.7);
            gain.gain.setValueAtTime(0.08, start);
            gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.75);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 0.75);
          });
        } else if (type === 'tend') {
          // Warm low-mid harmonic hum
          [264, 396].forEach((freq, i) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            const start = now + i * 0.06;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.09, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 0.5);
          });
        } else if (type === 'normal' || type === 'magic' || type === 'rare' || type === 'unique') {
          const chords = {
            normal: [432, 540],
            magic: [432, 540, 648],
            rare: [432, 540, 648, 864],
            unique: [288, 432, 540, 648, 864, 1080]
          };
          const freqs = chords[type] || chords.normal;
          freqs.forEach((freq, idx) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            const start = now + idx * 0.07;
            const dur = type === 'unique' ? 1.1 : 0.6;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.075, start);
            gain.gain.exponentialRampToValueAtTime(0.0008, start + dur);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + dur);
          });
        } else if (type === 'night') {
          // Deep singing bowl chord
          [216, 324, 432, 648].forEach((freq, idx) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            const start = now + idx * 0.12;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.08, start);
            gain.gain.exponentialRampToValueAtTime(0.0005, start + 1.4);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 1.4);
          });
        }
      } catch (e) {
        // Ignore audio errors
      }
    }
  };
};

    let mounted = true;
    loadStateOffline().then(({ data, engine }) => {
      if (!mounted) return;
      setStorageStatus(engine);
      if (data) {
        if (typeof data.hp === 'number') setHp(data.hp);
        if (typeof data.mp === 'number') setMp(data.mp);
        if (typeof data.cocoonMode === 'boolean') setCocoonMode(data.cocoonMode);

    setStressInput('');
    setStarlightDrops((s) => s + 5);
    notify('已溫柔收進「內在修枝手札」，留待合適時機安頓 (+5 微光)', 'sage');
  };

  const handleReleaseToWind = () => {
    const trimmed = stressInput.trim();
    if (!trimmed || driftStage !== 'idle') {
      notify('請先寫下想要釋放的「他人課題」或外在雜訊', 'amber');
      return;
    }
    audioRef.current.play('breeze', soundEnabled);
    setDriftText(trimmed);
    setDriftStage('glowing');

    // Create floating firefly/dandelion particles that drift softly into the night sky
    const chars = trimmed.split('');
    const count = Math.min(22, Math.max(12, chars.length));
    const fireflies = Array.from({ length: count }, (_, idx) => {
      const spreadX = (Math.random() - 0.5) * 220;
      const liftY = -45 - Math.random() * 95;
      return {
        id: idx,
        char: chars[idx % chars.length] || '✦',
        dx: spreadX,
        dy: liftY,
        scale: 0.4 + Math.random() * 0.8,
        color: idx % 3 === 0 ? '#FDE68A' : idx % 3 === 1 ? '#A7F3D0' : '#BAE6FD'
      };
    });
    setDriftFireflies(fireflies);

    setTimeout(() => {
      setDriftStage('drifting');
    }, 320);

    setTimeout(() => {
      setDriftStage('idle');
      setDriftText('');
      setStressInput('');
      setDriftFireflies([]);
      setReleasedCount((c) => c + 1);
      setStarlightDrops((s) => s + 10);
      setMp((m) => Math.min(100, m + 5));
      notify('已將他人的課題隨風吹散，心智留白恢復 +5%', 'amber');
    }, 1050);
  };

  const toggleInnerNote = (id) => {
    setInnerNotes((prev) =>
      prev.map((item) => (item.id === id ? { ...item, resolved: !item.resolved } : item))
    );
  };

  const removeInnerNote = (id) => {
    setInnerNotes((prev) => prev.filter((item) => item.id !== id));
  };

  // ============================================================================
  // MODULE 3 HANDLERS: INSPIRATION HERBARIUM (靈感標本室)
  // ============================================================================
  const handleCollectSpecimen = (e) => {
    if (e) e.preventDefault();
    const trimmed = inspirationInput.trim();
    if (!trimmed) {
      notify('請先寫下你的刺青手稿、饒舌韻腳或 Podcast 靈感片段', 'amber');
      return;
    }

    const rarityKey = rollResonance();
    const tier = RESONANCE_SPECTRUM[rarityKey];
    const whisper = pickWhisper(rarityKey);
    const now = new Date();
    const timeStr = `今日 ${String(now.getHours()).padStart(2, '0')}:${String(
      now.getMinutes()
    ).padStart(2, '0')}`;

    const newSpecimen = {
      id: `spec-${Date.now()}`,
      category: selectedCategory,
      content: trimmed,
      rarity: rarityKey,
      whisper,
      createdAt: timeStr,
      pinned: rarityKey === 'unique' || rarityKey === 'rare'
    };

    audioRef.current.play(rarityKey, soundEnabled);
    setSpecimens((prev) => [newSpecimen, ...prev]);
    setInspirationInput('');
    setLatestSpecimen(newSpecimen);
    setStarlightDrops((s) => s + (rarityKey === 'unique' ? 35 : rarityKey === 'rare' ? 20 : 8));
    notify(`靈感已結晶為【${tier.name}】波長標本`, rarityKey === 'unique' ? 'aurora' : 'sage');
  };

  const handleSeedPrompt = () => {
    const pool = SAMPLE_CREATIVE_SEEDS[selectedCategory] || SAMPLE_CREATIVE_SEEDS.tattoo;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setInspirationInput(pick);
  };

  const handleReattuneResonance = (id) => {
    if (starlightDrops < 15) {
      notify('微光露珠不足 15 滴，先深呼吸或吹散雜訊來累積微光吧', 'amber');
      return;
    }
    const newRarity = rollResonance();
    const tier = RESONANCE_SPECTRUM[newRarity];
    const whisper = pickWhisper(newRarity);
    audioRef.current.play(newRarity, soundEnabled);
    setStarlightDrops((s) => s - 15);
    setSpecimens((prev) =>
      prev.map((item) => (item.id === id ? { ...item, rarity: newRarity, whisper } : item))
    );
    notify(`已重新調頻共鳴波長：【${tier.name}】`, 'sage');
  };

  const handleRemoveSpecimen = (id) => {
    setSpecimens((prev) => prev.filter((item) => item.id !== id));
    if (latestSpecimen && latestSpecimen.id === id) setLatestSpecimen(null);
    notify('已從標本室移除該筆記錄', 'sage');
  };

  const handleTogglePinSpecimen = (id) => {
    setSpecimens((prev) =>
      prev.map((item) => (item.id === id ? { ...item, pinned: !item.pinned } : item))
    );
  };

  const handleCopyText = (text, id) => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setCopiedId(id);
      setTimeout(() => setCopiedId(null), 1800);
      notify('文字已複製到剪貼簿', 'sage');
    } catch (e) {
      notify('已複製', 'sage');
    }
  };

  // ============================================================================
  // MODULE 4 HANDLERS: NIGHTLY STILLNESS RITUAL
  // ============================================================================
  const openNightlyRitual = () => {
    audioRef.current.play('night', soundEnabled);
    setShowRecoveryModal(true);
  };

  const handleCompleteNightlyRest = () => {
    const reflection = composeNightlyReflection({
      specimenCount: specimens.length,
      releasedCount,
      innerCount: innerNotes.length,
      hp,
      mp,
      auroraCount: specimens.filter((i) => i.rarity === 'unique').length
    });
    const now = new Date();
    const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 ${String(now.getHours()).padStart(
      2,
      '0'
    )}:${String(now.getMinutes()).padStart(2, '0')}`;

    setNightlyLogs((prev) => [
      {
        id: `night-${Date.now()}`,
        date: dateStr,
        specimens: specimens.length,
        released: releasedCount,
        moodTag: reflection.moodTag,
        quote: reflection.quote
      },
      ...prev
    ]);
    setHp(100);
    setMp(100);
    setCocoonMode(false);
    setShowRecoveryModal(false);
    notify('晚安沉澱已完成，身體潮汐與心智留白已溫柔重置至 100%', 'sage');
  };

  const handleExportBackup = () => {
    const payload = {
      app: 'Cognitive Ecology Sanctuary PWA',
      exportedAt: new Date().toISOString(),
      hp,
      mp,
      releasedCount,
      starlightDrops,
      specimens,
      innerNotes,
      nightlyLogs
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cognitive-ecology-sanctuary-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify('已匯出溫室手札備份檔 (.json)', 'sage');
  };

  // Filtered Specimens
  const filteredSpecimens = useMemo(() => {
    return specimens.filter((item) => {
      const catOk = filterCategory === 'all' || item.category === filterCategory;
      const rarOk = filterRarity === 'all' || item.rarity === filterRarity;
      return catOk && rarOk;
    });
  }, [specimens, filterCategory, filterRarity]);

  const spectrumCounts = useMemo(() => {
    return {
      unique: specimens.filter((i) => i.rarity === 'unique').length,
      rare: specimens.filter((i) => i.rarity === 'rare').length,
      magic: specimens.filter((i) => i.rarity === 'magic').length,
      normal: specimens.filter((i) => i.rarity === 'normal').length
    };
  }, [specimens]);

  const nightlyReflection = useMemo(() => {
    return composeNightlyReflection({
      specimenCount: specimens.length,
      releasedCount,
      innerCount: innerNotes.length,
      hp,
      mp,
      auroraCount: spectrumCounts.unique
    });
  }, [specimens.length, releasedCount, innerNotes.length, hp, mp, spectrumCounts.unique]);

  return (
    <div
      style={{ backgroundColor: '#0D100F' }}
      className="min-h-screen text-stone-100 font-sans pb-28 relative overflow-x-hidden selection:bg-emerald-300/30 selection:text-emerald-100 transition-colors duration-700"
    >
      {/* AMBIENT BREATHING BACKGROUND HALOS */}
      <div className="pointer-events-none fixed inset-0 overflow-hidden z-0">
        <div
          className={`absolute -top-28 left-1/2 -translate-x-1/2 w-[520px] h-[520px] rounded-full blur-[130px] transition-all duration-1000 ${
            isLowEnergy || cocoonMode
              ? 'bg-amber-500/15'
              : 'bg-emerald-500/12'
          }`}
        />
        <div
          className={`absolute top-1/3 -right-32 w-[380px] h-[380px] rounded-full blur-[140px] transition-all duration-1000 ${
            isLowEnergy ? 'bg-rose-500/10' : 'bg-sky-500/10'
          }`}
        />
      </div>

      {/* ORGANIC ANIMATIONS */}
      <style>{`
        @keyframes softAmberPulse {
          0%, 100% {
            border-color: rgba(251, 191, 36, 0.55);
            box-shadow: 0 12px 45px rgba(245, 158, 11, 0.16), inset 0 0 25px rgba(251, 191, 36, 0.08);
          }
          50% {
            border-color: rgba(253, 230, 138, 0.22);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.06), inset 0 0 10px rgba(251, 191, 36, 0.02);
          }
        }
        .cocoon-amber-border {
          animation: softAmberPulse 3.2s infinite ease-in-out;
        }
        @keyframes orbFloat {
          0%, 100% { transform: translateY(0px) scale(1); }
          50% { transform: translateY(-4px) scale(1.03); }
        }
        .sanctuary-orb-float {
          animation: orbFloat 5s infinite ease-in-out;
        }
        @keyframes goldLineSweep {
          0% { width: 0%; opacity: 0.9; }
          100% { width: 100%; opacity: 0.35; }
        }
        .breeze-gold-line {
          animation: goldLineSweep 0.35s ease-out forwards;
        }
      `}</style>

      {/* FLOATING GENTLE TOAST */}
      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md pointer-events-none">
          <div
            className={`px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm tracking-wide ${
              toast.tone === 'aurora'
                ? 'bg-stone-900/90 border-orange-300/60 text-orange-100'
                : toast.tone === 'amber'
                ? 'bg-stone-900/90 border-amber-300/50 text-amber-100'
                : 'bg-stone-900/90 border-emerald-300/40 text-emerald-100'
            }`}
          >
            <Sparkles className="w-4 h-4 shrink-0 text-amber-200" />
            <span className="truncate">{toast.msg}</span>
          </div>
        </div>
      )}

      {/* TOP SANCTUARY HEADER */}
      <header className="sticky top-0 z-30 border-b border-white/[0.06] bg-[#0D100F]/80 backdrop-blur-xl">
        <div className="max-w-3xl mx-auto px-4 py-3.5">
          <div className="flex items-center justify-between gap-3">
            {/* Botanical Glass Orb + Title */}
            <div className="flex items-center gap-3.5 min-w-0">
              <div className="sanctuary-orb-float relative w-11 h-11 rounded-2xl overflow-hidden border border-white/15 shadow-[0_0_25px_rgba(167,243,208,0.18)] shrink-0 bg-stone-900">
                <img

                    <span className="text-stone-400">{tier.probText}</span>

                  className="p-4 rounded-2xl bg-black/35 border border-white/[0.06] space-y-1.5"

                  <p className="text-sm text-stone-200 italic leading-relaxed">{log.quote}</p>

          </section>

        {activeTab === 'guide' && (

                Design Vision &amp; Mobile Setup
              </span>
              <h2 className="text-xl font-semibold text-stone-100 mt-0.5">
                為什麼我們將它改造成「暗夜植物溫室」？

              <p className="text-xs sm:text-sm text-stone-300 leading-relaxed mt-2">
                對於同時擁有刺青美學、饒舌創作與深度思考特質的她而言，管理身心靈與收集靈感不該像「打電動刷數據」那樣充滿壓迫感。因此我們捨棄了吵雜的電玩血條與刺眼紅框，改以
                <strong className="text-emerald-200 font-medium">「有機靜謐・暗夜溫室」</strong>
                為核心體驗：
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 text-xs sm:text-sm">
              <div className="p-4 rounded-2xl bg-black/35 border border-white/[0.06] space-y-1">
                <div className="font-medium text-emerald-200">1. 從「血條警報」到「潮汐與繭居結界」</div>
                <p className="text-stone-400 leading-relaxed">
                  當能量低於 30% 時，不再用令人焦慮的紅光閃爍催促，而是點亮溫暖的琥珀燭光，溫柔提醒她開啟「大爺靜養結界」。
                </p>
              </div>
              <div className="p-4 rounded-2xl bg-black/35 border border-white/[0.06] space-y-1">
                <div className="font-medium text-amber-200">2. 從「暴力粉碎」到「化為螢火隨風吹散」</div>
                <p className="text-stone-400 leading-relaxed">
                  面對他人的課題，用蒲公英星塵緩緩升空消散的詩意動畫與風鈴泛音，帶來真正平靜的心理釋放。
                </p>
              </div>
              <div className="p-4 rounded-2xl bg-black/35 border border-white/[0.06] space-y-1">
                <div className="font-medium text-sky-200">3. 從「打寶掉裝」到「四階共鳴光譜標本」</div>
                <p className="text-stone-400 leading-relaxed">
                  保留 60% / 25% / 10% / 5% 的驚喜感，但化為「霧白晨露、汐藍深流、琥珀松脂、極光神諭」四種藝術標本卡。
                </p>
              </div>
              <div className="p-4 rounded-2xl bg-black/35 border border-white/[0.06] space-y-1">
                <div className="font-medium text-orange-200">4. 零基礎 30 秒裝進手機桌面</div>
                <p className="text-stone-400 leading-relaxed">
                  直接將下方打包好的壓縮檔拖入免費的 Tiiny.host 或 Netlify Drop，即可用 Safari / Chrome「加入主畫面」成為全螢幕獨立 App。
                </p>
              </div>
            </div>
          </section>
        )}
      </main>

      {/* ====================================================================

         ==================================================================== */}

          <div className="w-full max-w-lg rounded-3xl bg-[#121615] border border-amber-200/30 shadow-[0_20px_70px_rgba(0,0,0,0.75)] p-6 sm:p-7 space-y-5">
            <div className="flex items-center justify-between border-b border-white/[0.07] pb-3.5">
              <div className="flex items-center gap-2.5">
                <Moon className="w-5 h-5 text-amber-200" />
                <div>
                  <div className="text-[10px] tracking-widest uppercase text-amber-200/80">
                    Nightly Sanctuary Note
                  </div>
                  <h3 className="text-lg font-semibold text-stone-100">今夜沉澱手札</h3>
                </div>
              </div>
              <span className="px-3 py-1 rounded-full bg-amber-200/15 border border-amber-200/30 text-xs text-amber-100">
                {nightlyReflection.moodTag}
              </span>
            </div>

            <div className="grid grid-cols-3 gap-2.5 text-center">
              <div className="p-3.5 rounded-2xl bg-black/40 border border-white/[0.06]">

                <div className="text-xl font-light text-amber-200 mt-1">{specimens.length} 枚</div>
              </div>
              <div className="p-3.5 rounded-2xl bg-black/40 border border-white/[0.06]">
                <div className="text-[11px] text-stone-400">吹散外在雜訊</div>
                <div className="text-xl font-light text-emerald-200 mt-1">{releasedCount} 次</div>
              </div>
              <div className="p-3.5 rounded-2xl bg-black/40 border border-white/[0.06]">
                <div className="text-[11px] text-stone-400">身心潮汐</div>
                <div className="text-sm font-medium text-sky-200 mt-2">
                  {hp}% · {mp}%
                </div>
              </div>
            </div>

            <div className="p-5 rounded-2xl bg-gradient-to-br from-amber-950/30 via-black/40 to-emerald-950/25 border border-amber-200/25 space-y-2.5">
              <div className="text-xs font-medium text-amber-200">{nightlyReflection.title}</div>
              <blockquote className="text-sm sm:text-base text-stone-100 leading-relaxed font-normal">
                {nightlyReflection.quote}
              </blockquote>
              <p className="text-xs text-stone-400 pt-1">{nightlyReflection.note}</p>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-end gap-2.5 pt-1">
              <button
                type="button"
                onClick={() => setShowRecoveryModal(false)}
                className="w-full sm:w-auto px-4 py-2.5 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-stone-300 text-xs font-medium"
              >
                再留一會兒
              </button>
              <button
                type="button"
                onClick={handleCompleteNightlyRest}
                className="w-full sm:w-auto px-6 py-2.5 rounded-full bg-gradient-to-r from-amber-200 via-emerald-200 to-sky-200 text-stone-950 font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg"
              >
                <RotateCcw className="w-4 h-4" />
                <span>道聲晚安 · 將身心潮汐修復至 100%</span>

            </div>
          </div>
        </div>

         ==================================================================== */}
      {showInstallModal && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto">

            <div className="flex items-center justify-between border-b border-white/[0.07] pb-3">
              <div className="flex items-center gap-2.5">
                <Smartphone className="w-5 h-5 text-emerald-300" />
                <h3 className="text-base sm:text-lg font-semibold text-stone-100">
                  免寫程式 · 30 秒把「認知生態圈」裝進手機桌面

              </div>
              <button
                type="button"
                onClick={() => setShowInstallModal(false)}
                className="px-3 py-1 rounded-full bg-white/[0.06] text-stone-300 text-xs"
              >
                關閉 ✕
              </button>
            </div>

            <div className="space-y-3 text-xs sm:text-sm text-stone-200 leading-relaxed">
              <div className="p-4 rounded-2xl bg-amber-950/40 border border-amber-300/40 space-y-1.5">
                <div className="font-semibold text-amber-200">
                  💡 為什麼你的 GitHub Pages (2128-png.github.io) 顯示「無法安裝」？
                </div>
                <p className="text-stone-300 text-xs leading-relaxed">
                  1. <strong>立即可用解法（免重傳）</strong>：直接點擊你截圖選單下方的第二個選項 <strong>「建立捷徑（在 Chrome 中開啟捷徑）」</strong>，就能立刻把捷徑放到手機桌面！<br />
                  2. <strong>完美全螢幕 App 解法</strong>：之前版本因為圖示放在子資料夾 <code>icons/</code>，上傳 GitHub 時資料夾被略過導致找不到圖示。新版壓縮包已改為<strong>「無子資料夾扁平結構」</strong>，解壓縮後把 <strong>全部 5 個檔案</strong>（<code>index.html</code>、<code>manifest.json</code>、<code>sw.js</code>、<code>icon-192.png</code>、<code>icon-512.png</code>）一起上傳到 GitHub 同一個目錄，Chrome 的「安裝」按鈕就會正式亮起！
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="p-4 rounded-2xl bg-black/40 border border-white/[0.06] space-y-1">
                  <div className="font-semibold text-emerald-200">方法 A：直接點「建立捷徑」</div>
                  <p className="text-xs text-stone-300">
                    在你剛剛的 Chrome 畫面直接點選第二行 <strong>「建立捷徑」</strong>，新版 <code>index.html</code> 已內嵌高畫質圖示與全螢幕標籤，只傳單一檔案也能顯示專屬圖示！
                  </p>
                </div>
                <div className="p-4 rounded-2xl bg-black/40 border border-white/[0.06] space-y-1">
                  <div className="font-semibold text-sky-200">方法 B：5 個檔案全傳 GitHub</div>
                  <p className="text-xs text-stone-300">
                    把新版壓縮包解壓後的 5 個檔案放在同一層上傳至 <code>2128-png.github.io</code>，清除快取重新整理後即可點選「安裝」。
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ====================================================================
          BOTTOM SANCTUARY NAVIGATION BAR
         ==================================================================== */}
      <nav
        aria-label="溫室底部導覽列"
        className="fixed bottom-0 left-0 right-0 z-40 bg-[#0D100F]/90 backdrop-blur-2xl border-t border-white/[0.07]"
      >
        <div className="max-w-3xl mx-auto px-4 py-2 grid grid-cols-4 gap-2">
          <button
            type="button"
            onClick={() => setActiveTab('sanctuary')}
            className={`py-2 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
              activeTab === 'sanctuary'
                ? 'bg-white/[0.09] text-emerald-200 border border-white/15'
                : 'text-stone-400 hover:text-stone-200'
            }`}
          >
            <Compass className="w-4 h-4" />
            <span className="text-[11px] font-medium">靜謐溫室</span>
          </button>

          <button
            type="button"
            onClick={() => setActiveTab('herbarium')}
            className={`py-2 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
              activeTab === 'herbarium'
                ? 'bg-white/[0.09] text-amber-200 border border-white/15'
                : 'text-stone-400 hover:text-stone-200'
            }`}
          >
            <Layers className="w-4 h-4" />
            <span className="text-[11px] font-medium">標本典藏 ({specimens.length})</span>
          </button>

          <button
            type="button"
            onClick={openNightlyRitual}
            className="py-2 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 text-amber-200/90 hover:bg-white/[0.06] transition-all"
          >
            <Moon className="w-4 h-4" />
            <span className="text-[11px] font-medium">晚安沉澱</span>
          </button>

          <button
            type="button"
            onClick={() => setActiveTab('guide')}
            className={`py-2 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
              activeTab === 'guide'
                ? 'bg-white/[0.09] text-sky-200 border border-white/15'
                : 'text-stone-400 hover:text-stone-200'
            }`}
          >
            <BookOpen className="w-4 h-4" />
            <span className="text-[11px] font-medium">設計與安裝</span>
          </button>
        </div>
      </nav>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
